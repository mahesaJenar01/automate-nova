name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and release, e.g. 1.0.1 (the v-prefixed tag is created for you)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$GITHUB_REF_NAME"
          fi
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be MAJOR.MINOR.PATCH (got '$VERSION')"
            exit 1
          fi
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ]; then
            echo "::error::MINOR and PATCH must each be <= 99 to keep versionCode monotonic"
            exit 1
          fi
          # Monotonic and human-readable: 1.2.3 -> 10203
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          {
            echo "name=$VERSION"
            echo "code=$CODE"
            echo "tag=v$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (versionCode $CODE)"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set. See RELEASING.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease \
            "-PversionName=$VERSION_NAME" \
            "-PversionCode=$VERSION_CODE"

      - name: Verify signature and stage the APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            yes | sdkmanager "build-tools;35.0.0" >/dev/null
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          fi
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          # A debug-signed APK could never update a properly signed install - fail loudly.
          if grep -q 'CN=Android Debug' certs.txt; then
            echo "::error::APK was signed with the debug key - check the four signing secrets"
            exit 1
          fi
          mv "$APK" "automate-nova-$VERSION_NAME.apk"
          echo "APK_PATH=automate-nova-$VERSION_NAME.apk" >> "$GITHUB_ENV"

      - name: Remove keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Create the tag for manually triggered runs
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$APK_PATH" --title "$TAG" --generate-notes
            echo "Created release $TAG"
          elif gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$APK_PATH"; then
            # Someone published this release by hand (run.bat release + drag-and-drop).
            # Never overwrite that asset - it is signed with the same key and is the
            # one the user actually checked.
            echo "::notice::Release $TAG already has $APK_PATH - leaving it untouched."
          else
            gh release upload "$TAG" "$APK_PATH"
            echo "Added $APK_PATH to existing release $TAG"
          fi

# The version "run.bat release" counts from.
#
# It records the last version built here, and is rewritten after a successful
# release build - it is not something to edit by hand. "run.bat release" steps
# the patch of it; "run.bat release minor" and "major" step those instead.
#
# versionCode is not stored: both release paths derive it from the name as
# MAJOR*10000 + MINOR*100 + PATCH, so 1.2.3 becomes 10203.
versionName=1.0.5
